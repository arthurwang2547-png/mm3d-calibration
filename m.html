<style>/* STEP 00 行前確認（手機版）

#mobile-v2 .pf-head{display:flex;align-items:center;gap:8px;flex:none;min-height:22px}

      var on = isAcked(c.key);
      if (on) done++;
      el.classList.toggle('acked', on);
      var b = el.querySelector('.pf-ack');
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.textContent = on ? '已確認 ✓' : '我知道了';
    });
    var total = CARDS.length;
    var ready = done === total;
    bar.style.width = (done / total * 100) + '%';
    countEl.textContent = done + ' / ' + total;
    go.disabled = !ready;
    go.textContent = ready ? '開始教學　▶' : '先確認上面 ' + total + ' 項';
    hint.textContent = ready ? total + ' 項都確認過了，可以開始' : '還有 ' + (total - done) + ' 項要確認';
    hint.classList.toggle('ready', ready);
    if (modalKey && !modal.hidden) mAck.textContent = isAcked(modalKey) ? '已確認 ✓' : '我知道了';
  }

  function setAcked(k, on) {
    var i = acked.indexOf(k);
    if (on && i < 0) acked.push(k);
    if (!on && i >= 0) acked.splice(i, 1);
    save(acked);
    sync();
  }

  function openModal(k) {
    var d = DATA[k];
    if (!d) return;
    modalKey = k;
    mTitle.textContent = d.title;
    var src = ASSETS[k];
    if (src) { mImg.src = src; mImg.hidden = false; } else { mImg.removeAttribute('src'); mImg.hidden = true; }
    mImg.alt = d.alt || d.title;
    mCap.textContent = d.cap || '';
    mSteps.innerHTML = d.steps.map(function (s) { return '<li>' + s + '</li>'; }).join('');
    mAck.textContent = isAcked(k) ? '已確認 ✓' : '我知道了';
    modal.hidden = false;
    requestAnimationFrame(function () { modal.classList.add('open'); });
  }
  function closeModal() {
    modal.classList.remove('open');
    modalKey = null;
    setTimeout(function () { modal.hidden = true; }, 160);
  }

  var autoStart = false;
  var pendingDone = null;

  function open(opts) {
    opts = opts || {};
    autoStart = !!opts.autoStart;
    pendingDone = typeof opts.onDone === 'function' ? opts.onDone : null;
    closeBtn.hidden = autoStart;
    if (!autoStart) { try { if (window.narration && !window.narration.paused) window.narration.pause(); } catch (e) {} }
    root.classList.add('open');
    list.scrollTop = 0;
    sync();
  }
  function close() {
    root.classList.remove('open');
    closeModal();
  }

  list.addEventListener('click', function (e) {
    var look = e.target.closest('.pf-look');
    if (look) { openModal(look.closest('.pf-item').getAttribute('data-key')); return; }
    var ack = e.target.closest('.pf-ack');
    if (ack) {
      var k = ack.closest('.pf-item').getAttribute('data-key');
      setAcked(k, !isAcked(k));
    }
  });

  mAck.addEventListener('click', function () {
    if (modalKey) setAcked(modalKey, true);
    closeModal();
  });
  mClose.addEventListener('click', closeModal);
  modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });
  closeBtn.addEventListener('click', close);

  go.addEventListener('click', function () {
    if (go.disabled) return;
    close();
    var done = pendingDone; pendingDone = null;
    if (autoStart) {
      // 獨立版四頁：確認完直接進第 1 小段（原本那張封面就不用了）
      var start = document.querySelector('.v2-start button');
      if (start) { start.click(); return; }
    }
    if (done) done();
  });

  // ── 右上角 ⚙ 也能重看 ────────────────────────────────────────────
  var settings = document.querySelector('.v2-settings');
  if (settings) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pf-open';
    btn.textContent = '行前確認（STEP 00）';
    btn.addEventListener('click', function () { settings.hidden = true; open({ autoStart: false }); });
    settings.appendChild(btn);
  }

  sync();

  // 給外殼（m.html）用的 API；獨立版四頁不走這裡
  window.MobileStep00 = {
    open: open,
    close: close,
    allAcked: allAcked,
    reset: function () { acked = []; save(acked); sync(); }
  };

  // ── 什麼時候自動攔 ────────────────────────────────────────────────
  // 獨立版四頁：只有課程第一頁（沒有 prevPage）才攔；外殼自己呼叫 open()，不自動攔。
  if (CFG.manual) return;
  var isFirstPage = !CFG.prevPage;
  var cameBack = /last/.test(location.hash || '');
  if (isFirstPage && !cameBack && !allAcked()) open({ autoStart: true });
})();
</script>
<script>
/* 手機版入口：大畫面 → 四項行前確認 → 三個章節播放器接力演出 */
(function () {
  var CH = [
    { file: 'player-0105.html', kicker: 'STEP 01–04', title: '確認焦距與中立位置', text: '鏡頭校正的第一步：量測焦距高度、校正最外圈、確認中心線，最後把 Z0 尺寸校準。', fine: '共 18 小段' },
    { file: 'player-0610.html', kicker: 'STEP 05–09', title: '進入 3D 多層校正', text: '進 3D 校正頁、看懂 Z0 與正負號、切換工作層、調整該層焦點，再新增實體高度層。', fine: '共 22 小段' },
    { file: 'player-1115.html', kicker: 'STEP 10–14', title: '新增層校正到完成', text: '新增層的中心焦點、四角落焦、回尺寸校正、格點校正，最後確認層數完成。', fine: '共 19 小段' }
  ];
  var idx = -1;
  var stage = document.getElementById('stage'), frame = document.getElementById('lesson');
  var cover = document.getElementById('cover'), card = document.getElementById('card');

  function showCard(i, done) {
    var c = CH[i] || {};
    document.getElementById('card-kicker').textContent = done ? '全部完成' : c.kicker;
    document.getElementById('card-title').textContent = done ? '14 步都走完了' : c.title;
    document.getElementById('card-text').textContent = done
      ? '多層校正的流程到這裡結束。要再看一次，可以從頭重播。'
      : c.text;
    document.getElementById('card-go').textContent = done ? '從頭再看一次' : '繼續　▶';
    document.getElementById('card-fine').textContent = done ? '' : (c.fine || '');
    card.classList.add('on');
  }

  function load(i) {
    idx = i;
    card.classList.remove('on');
    stage.classList.add('on');
    frame.src = CH[i].file;
    frame.onload = function () {
      // file:// 之下兩個頁面算跨來源，只能 postMessage（不能直接呼叫 contentWindow）
      try { frame.contentWindow.postMessage({ type: 'mm3d-start' }, '*'); } catch (e) {}
    };
  }

  // 章節播完（播放器發訊息回來）
  window.addEventListener('message', function (e) {
    if (e.source !== frame.contentWindow || !e.data) return;
    if (e.data.type !== 'mm3d-done') return;
    var next = idx + 1;
    showCard(next, next >= CH.length);
  });

  document.getElementById('card-go').onclick = function () {
    if (idx + 1 >= CH.length) { location.reload(); return; }
    load(idx + 1);
  };

  // 開始教學 → 行前四項 → 進第一章
  document.getElementById('start').onclick = function () {
    function go() { cover.style.display = 'none'; load(0); }
    if (window.MobileStep00 && !window.MobileStep00.allAcked()) {
      window.MobileStep00.open({ autoStart: true, onDone: go });
    } else {
      go();
    }
  };
})();
</script>
</body></html>
